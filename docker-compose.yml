services:
  # Banco NoSQL onde as tarefas ficam salvas
  mongodb:
    image: mongo:7
    container_name: tk-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Fila de mensagens. A imagem "management" inclui um painel web
  rabbitmq:
    image: rabbitmq:3-management
    container_name: tk-rabbitmq
    ports:
      - "5672:5672"     # porta usada pela aplicação
      - "15672:15672"   # painel web: http://localhost:15672
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # API que recebe e consulta as tarefas
  api:
    build:
      context: .
      target: api
    container_name: tk-api
    ports:
      - "5099:8080"
    environment:
      # Em desenvolvimento o Swagger fica ativo
      ASPNETCORE_ENVIRONMENT: Development
      # Dentro do Docker, os serviços se encontram pelo nome, e não por localhost
      Mongo__StringConexao: mongodb://mongodb:27017
      RabbitMq__Host: rabbitmq
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Worker que processa as tarefas da fila. Sem container_name, para poder rodar várias cópias
  worker:
    build:
      context: .
      target: worker
    environment:
      Mongo__StringConexao: mongodb://mongodb:27017
      RabbitMq__Host: rabbitmq
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: on-failure

# Os volumes guardam os dados mesmo se os containers forem recriados
volumes:
  mongodb_data:
  rabbitmq_data: